name: CI/CD - BrainCodeSchool

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  backend:
    name: Backend - lint, tests e build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: back-end

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"

      - name: Testes
        run: npm test -- --runInBand
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: blog_db_test
          JWT_SECRET: ci-test-secret

      - name: Build
        run: npm run build

  frontend:
    name: Frontend - lint e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000

  compose:
    name: Docker Compose - build e smoke test
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-compose-secret
      DB_SYNCHRONIZE: "true"
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagens com Compose
        run: docker compose build

      - name: Subir stack
        run: docker compose up -d

      - name: Verificar estado dos containers
        run: docker compose ps

      - name: Aguardar API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke test do frontend
        run: curl --fail --silent http://localhost:8080 > /dev/null

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Encerrar stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-latest
    needs:
      - compose
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar tags das imagens
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/braincodeschool-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/braincodeschool-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construir e publicar imagens
        run: docker compose build
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          JWT_SECRET: publish-build-secret
          DB_SYNCHRONIZE: "false"

      - name: Push das imagens
        run: docker compose push backend frontend
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}

      - name: Publicar tags latest
        if: success()
        run: |
          docker tag "${{ steps.images.outputs.backend }}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/braincodeschool-backend:latest"
          docker tag "${{ steps.images.outputs.frontend }}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/braincodeschool-frontend:latest"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/braincodeschool-backend:latest"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/braincodeschool-frontend:latest"
